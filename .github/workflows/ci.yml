#
# Runs on every push and pull request. Later milestones add: distro container
# matrix (bootstrap + install + smoke test), export builds, packaging, the
# level-validator bot, iOS (macOS runner) and tagged releases.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (shellcheck, gdlint, schemas, REUSE, identity)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned dev tools
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -r requirements-dev.txt
      - run: make lint-shell
      - run: make lint-gd
      - run: make lint-data
      - run: make lint-reuse
      - run: make lint-identity
      - run: make lint-pot
      - run: make test-scripts

  test:
    name: Unit + smoke tests (Godot headless)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Cache pinned Godot and godot-rapier
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/siegefall-dev/godot
            ~/.cache/siegefall-dev/rapier
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain.lock') }}
      - name: Bootstrap (packages, pinned Godot, GUT, godot-rapier)
        run: scripts/bootstrap.sh --yes --refresh --editor-only --no-venv
      - run: make test
      - name: Level 1 is winnable (scripted gold shot)
        run: |
          scripts/godot.sh --headless --fixed-fps 60 --path game -- \
            --level=greenmantle-01 --autoplay=0.65 --quit-after=14 --no-save
      - name: Every castle stands still and every level is still beatable
        run: make check-levels
      - name: Smoke test with a real GL context (Xvfb + llvmpipe + Compatibility)
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            scripts/godot.sh --path game --rendering-method gl_compatibility -- --smoke-test
