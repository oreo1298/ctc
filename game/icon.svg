<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb7d9"/>
      <stop offset="0.65" stop-color="#f6d9a8"/>
      <stop offset="1" stop-color="#f3b27a"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cae5a"/>
      <stop offset="1" stop-color="#4f8a46"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9c1b4"/>
      <stop offset="1" stop-color="#9c9284"/>
    </linearGradient>
    <radialGradient id="rock" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#b3a999"/>
      <stop offset="1" stop-color="#6f665b"/>
    </radialGradient>
    <clipPath id="badge">
      <rect x="8" y="8" width="240" height="240" rx="56"/>
    </clipPath>
  </defs>
  <g clip-path="url(#badge)">
    <rect x="0" y="0" width="256" height="256" fill="url(#sky)"/>
    <circle cx="70" cy="150" r="34" fill="#fff4dc" opacity="0.85"/>
    <path d="M0 196 C 60 170 110 186 150 178 C 196 168 226 176 256 170 L256 256 L0 256 Z" fill="url(#hill)"/>
    <!-- tower -->
    <g transform="rotate(8 178 196)">
      <rect x="146" y="104" width="64" height="96" rx="6" fill="url(#stone)" stroke="#3b2f26" stroke-width="6"/>
      <path d="M140 104 h18 v-18 h14 v18 h12 v-18 h14 v18 h18 v14 h-76 z" fill="url(#stone)" stroke="#3b2f26" stroke-width="6" stroke-linejoin="round"/>
      <path d="M162 200 v-28 a16 16 0 0 1 32 0 v28" fill="#4a3a2e"/>
      <path d="M150 140 h56 M150 168 h56" stroke="#3b2f26" stroke-width="3" opacity="0.35"/>
    </g>
    <!-- flying crown -->
    <g transform="translate(196 54) rotate(24)">
      <path d="M-26 12 L-30 -14 L-14 0 L0 -20 L14 0 L30 -14 L26 12 Z" fill="#f4c542" stroke="#3b2f26" stroke-width="5" stroke-linejoin="round"/>
      <circle cx="0" cy="2" r="4" fill="#d9483b"/>
    </g>
    <!-- boulder + motion arc -->
    <path d="M18 126 C 48 70 88 58 116 70" fill="none" stroke="#fff8e8" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 14" opacity="0.9"/>
    <circle cx="132" cy="86" r="22" fill="url(#rock)" stroke="#3b2f26" stroke-width="6"/>
    <path d="M122 80 q6 -6 14 -2" stroke="#fff8e8" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="#3b2f26" stroke-width="8"/>
</svg>
