# SPDX-FileCopyrightText: 2026 Siegefall contributors
# SPDX-License-Identifier: MIT
#
# REUSE (https://reuse.software) licensing for files that cannot carry an
# SPDX header themselves. Code is MIT; original assets are CC-BY-SA-4.0;
# third-party assets keep their own licence (see CREDITS.md).
version = 1

# Godot-generated metadata (import settings, UIDs, scenes, resources) and
# engine config: part of the code base.
[[annotations]]
path = [
  "**/*.import",
  "**/*.uid",
  "**/*.tscn",
  "**/*.tres",
  "**/*.godot",
  "**/*.cfg",
  "game/export_presets.cfg",
  "tests/os-release/**",
  "flake.lock",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Siegefall contributors"
SPDX-License-Identifier = "MIT"

# Game data (levels, realms, ammo, materials, schemas) and translations.
[[annotations]]
path = ["game/data/**", "game/locale/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Siegefall contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Original art/audio produced by this project (procedural or hand-written)
# and documentation screenshots.
[[annotations]]
path = ["game/art/**", "game/audio/**", "docs/screenshots/**", "packaging/**/*.png"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Siegefall contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Third-party fonts (SIL Open Font License 1.1), vendored from the official
# google/fonts repository at commit 5bb28733cec313b63fbd415b574b5ae35c8aa8b8.
[[annotations]]
path = ["game/fonts/Fraunces.ttf", "game/fonts/Fraunces.ttf.import", "game/fonts/Fraunces-OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2018 The Fraunces Project Authors (https://github.com/undercasetype/Fraunces)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["game/fonts/Nunito.ttf", "game/fonts/Nunito.ttf.import", "game/fonts/Nunito-OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2014 The Nunito Project Authors (https://github.com/googlefonts/nunito)"
SPDX-License-Identifier = "OFL-1.1"
